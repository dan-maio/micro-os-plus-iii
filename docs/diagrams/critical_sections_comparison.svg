<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="100%" height="100%">
  <defs>
    <style>
      .h1 { font-family: 'Source Sans 3', sans-serif; font-weight: 700; font-size: 13.5px; }
      .lbl { font-family: 'Source Sans 3', sans-serif; font-weight: 600; font-size: 11px; fill: #0f172a; }
      .desc { font-family: 'Source Sans 3', sans-serif; font-size: 10px; fill: #475569; }
      .code-t { font-family: 'Hack Nerd Font', monospace; font-size: 10px; fill: #0369a1; }
      .box-sched { fill: #f0fdf4; stroke: #16a34a; rx: 6; stroke-width: 1.5; }
      .box-irq { fill: #fef2f2; stroke: #dc2626; rx: 6; stroke-width: 1.5; }
      .badge-ok { fill: #dcfce7; stroke: #15803d; rx: 3; }
      .badge-no { fill: #fee2e2; stroke: #b91c1c; rx: 3; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- LEFT: Scheduler Critical Section -->
  <g transform="translate(20, 20)">
    <rect width="375" height="300" class="box-sched" />
    <rect width="375" height="32" fill="#dcfce7" rx="6" />
    <text x="187.5" y="21" text-anchor="middle" class="h1" fill="#15803d">scheduler::critical_section</text>

    <!-- Scope -->
    <text x="20" y="58" class="lbl">TARGET: Thread Preemption Only</text>
    <text x="20" y="75" class="desc">Disables thread switching on the calling CPU.</text>

    <!-- HW Interrupts Status -->
    <rect x="20" y="90" width="335" height="45" class="badge-ok" />
    <text x="30" y="108" font-family="'Source Sans 3', sans-serif" font-size="11" font-weight="bold" fill="#15803d">✓ Hardware Interrupts: ENABLED (Zero Jitter)</text>
    <text x="30" y="125" font-family="'Source Sans 3', sans-serif" font-size="9.5" fill="#166534">Timer, UART, DMA ISRs execute immediately at full speed.</text>

    <!-- Timeline illustration -->
    <g transform="translate(20, 145)">
      <rect width="335" height="85" fill="#ffffff" stroke="#cbd5e1" rx="4" />
      <text x="10" y="20" class="code-t">Thread A: [--- scheduler::lock() ---]</text>
      <!-- ISR spike -->
      <rect x="110" y="30" width="70" height="22" fill="#fef3c7" stroke="#d97706" rx="3" />
      <text x="145" y="45" text-anchor="middle" font-family="'Hack Nerd Font', monospace" font-size="9" fill="#92400e">UART ISR</text>
      <text x="10" y="70" class="desc">ISR runs, returns to Thread A. Thread B waits.</text>
    </g>

    <!-- Best for -->
    <text x="20" y="255" class="lbl">BEST FOR:</text>
    <text x="20" y="272" class="desc">• Long thread-to-thread critical regions</text>
    <text x="20" y="288" class="desc">• Non-reentrant algorithms without delaying real-time ISRs</text>
  </g>

  <!-- RIGHT: Interrupts Critical Section -->
  <g transform="translate(425, 20)">
    <rect width="375" height="300" class="box-irq" />
    <rect width="375" height="32" fill="#fee2e2" rx="6" />
    <text x="187.5" y="21" text-anchor="middle" class="h1" fill="#b91c1c">interrupts::critical_section</text>

    <!-- Scope -->
    <text x="20" y="58" class="lbl">TARGET: Local IRQs + SMP Spinlock</text>
    <text x="20" y="75" class="desc">Masks CPU interrupts + acquires _smp_klock.</text>

    <!-- HW Interrupts Status -->
    <rect x="20" y="90" width="335" height="45" class="badge-no" />
    <text x="30" y="108" font-family="'Source Sans 3', sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">⛔ Hardware Interrupts: DISABLED (Latency Penalty)</text>
    <text x="30" y="125" font-family="'Source Sans 3', sans-serif" font-size="9.5" fill="#991b1b">Local hardware ISRs are deferred until exit().</text>

    <!-- Timeline illustration -->
    <g transform="translate(20, 145)">
      <rect width="335" height="85" fill="#ffffff" stroke="#cbd5e1" rx="4" />
      <text x="10" y="20" class="code-t">Core 0: [--- interrupts::enter() ---]</text>
      <!-- Blocked ISR spike -->
      <rect x="110" y="30" width="90" height="22" fill="#f1f5f9" stroke="#94a3b8" stroke-dasharray="2 2" rx="3" />
      <text x="155" y="45" text-anchor="middle" font-family="'Hack Nerd Font', monospace" font-size="9" fill="#64748b">IRQ BLOCKED</text>
      <text x="10" y="70" class="desc">Core 1 spins on _smp_klock. Zero concurrency.</text>
    </g>

    <!-- Best for -->
    <text x="20" y="255" class="lbl">BEST FOR:</text>
    <text x="20" y="272" class="desc">• Thread-to-ISR shared data (ring buffers, device registers)</text>
    <text x="20" y="288" class="desc">• Ultra-short kernel operations (ready lists, timer nodes)</text>
  </g>
</svg>