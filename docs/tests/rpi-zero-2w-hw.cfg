# =============================================================================
# rpi-zero-2w-hw.cfg — Raspberry Pi Zero 2 W hardware tests, AArch32 and
# AArch64, in ONE OpenOCD file. No .sh scripts needed.
#
# It holds, flattened into one place, what the test scripts use:
#   test/boards/rpi-zero-2w/openocd-jlink-rpi3.cfg, openocd-olimex.cfg,
#   rpi3-aarch32.cfg, bcm2837-aarch32.cfg (AArch32 port),
#   test/boards/rpi-zero-2w/openocd-jlink-rpi3.cfg, openocd-olimex.cfg
#   + OpenOCD's board/rpi3.cfg, target/bcm2837.cfg (AArch64 port),
#   and the session test_smpl/run-hw.sh writes, with the values the boards'
#   hw.sh give it. The OpenOCD commands sent to the board are the same.
#
# The probe is a SEGGER J-Link (default) or an Olimex ARM-USB-OCD, both
# driven by OpenOCD (xPack openocd 0.12.0-7.1). There is no SEGGER J-Link
# software (JLinkExe / JLinkGDBServer) configuration in these repositories.
#
# -----------------------------------------------------------------------------
# Usage — ONE test per power cycle (the Pi has no SRST):
#
#   OPENOCD=$HOME/.local/xPacks/@xpack-dev-tools/openocd/0.12.0-7.1/.content/bin/openocd
#   CFG=<this file>
#   ARCH=32            # 32 or 64
#   PROBE=jlink        # jlink or olimex
#
#   AArch32:
#   D=$BUILD/aarch32-rpi-zero-2w-cmake-gcc-debug/platform-bin/port-tests/test
#   NM=$HOME/.local/xPacks/@xpack-dev-tools/arm-none-eabi-gcc/15.2.1-1.1.1/.content/bin/arm-none-eabi-nm
#   AArch64:
#   D=$BUILD/aarch64-rpi-zero-2w-cmake-gcc-debug/platform-bin/port-tests/test
#   NM=$HOME/.local/xPacks/@xpack-dev-tools/aarch64-none-elf-gcc/15.2.1-1.1.1/.content/bin/aarch64-none-elf-nm
#
#   ELF=$D/smp_test0-hwd
#   SPIN=0x$($NM $ELF | awk '$3 == "__smp_spin" {print $1}')
#
#   # 1. reset through the watchdog, then let the board boot
#   $OPENOCD -c "set ARCH $ARCH; set PROBE $PROBE" -f $CFG -c uos_reset
#   sleep 12
#   # 2. halt, semihosting on, load, zero __smp_spin, resume
#   $OPENOCD -c "set ARCH $ARCH; set PROBE $PROBE" -f $CFG -c "uos_run $ELF $SPIN"
#
#   The test's semihosting output appears in the OpenOCD output; it passed
#   when it prints "RESULT: PASS". Stop OpenOCD with Ctrl-C, power-cycle the
#   board, then run the next test.
#
#   The UART console is not used here; keep your own terminal on it:
#     tio -b 115200 /dev/ttyACM0
#
# Tests (the *-hwd ELFs in $D) and the time run-hw.sh allows each:
#   smp_test0, smp_test1, smp_test2, smp_test3      120 s
#   smp_test4                                       300 s
#   smp-mat-test, smp-mat-sdcard-test               900 s
#   smp-num-test, smp-pipeline-test, smp-pro-cons-test  600 s
#   sd_test                                         450 s
#   usb_test, cmsis-os-validator, mutex-stress,
#   rtos-apis                                       300 s
#
# Facts per port (from test/boards/rpi-zero-2w/hw.sh):
#                     AArch32                     AArch64
#   entry             0x1003c                     0x80000
#   __smp_spin        uint32_t[4] -> 4 words      uint64_t[4] -> 8 words
#   resume            reg cpsr 0x600001da,        reg pc <entry>, then
#                     resume <entry>              resume
#   JTAG clock        1000 kHz (J-Link, Olimex)   4000 kHz (J-Link, Olimex)
#
#   The AArch64 Olimex config asks for 1000 kHz, but board/rpi3.cfg is
#   sourced after it and sets 4000 kHz, so 4000 kHz is what it runs at.
#   If the DAP reports "Invalid ACK (0) in DAP response", run-hw.sh advises
#   to retry at 1000 kHz: add  -c "adapter speed 1000"  after  -f $CFG.
#
# SD boot card config.txt (test/boards/rpi-zero-2w/config.txt):
#   AArch32: kernel=kernel7.img  arm_64bit=0  kernel_address=0x010000
#            enable_uart=1  gpu_mem=16  disable_splash=1
#   AArch64: arm_64bit=1  kernel=kernel8.img  enable_uart=1  core_freq=250
#            gpu_mem=16
# =============================================================================

if { ![info exists ARCH] } { set ARCH 32 }
if { ![info exists PROBE] } { set PROBE jlink }

# --- Probe -------------------------------------------------------------------

if { $PROBE eq "jlink" } {
	# interface/jlink.cfg
	adapter driver jlink
} elseif { $PROBE eq "olimex" } {
	source [find interface/ftdi/olimex-arm-usb-ocd.cfg]
	transport select jtag
	adapter speed 1000
} else {
	error "PROBE must be jlink or olimex, not '$PROBE'"
}

# --- BCM2837: 4x Cortex-A53, OpenOCD "aarch64" targets with a CTI each -------
# (bcm2837-aarch32.cfg for AArch32, target/bcm2837.cfg for AArch64; the two
# differ only in the JTAG clock.)

set _CHIPNAME bcm2837
set _cores 4
set _DAP_TAPID 0x4ba00477

jtag newtap $_CHIPNAME cpu -expected-id $_DAP_TAPID -irlen 4

if { $ARCH == 32 } {
	reset_config trst_only
	adapter speed 1000
} elseif { $ARCH == 64 } {
	adapter speed 4000
} else {
	error "ARCH must be 32 or 64, not '$ARCH'"
}

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# MEM-AP for direct access
target create $_CHIPNAME.ap mem_ap -dap $_CHIPNAME.dap -ap-num 0

# Debug base / CTI base addresses from the ROM table (dap info 0)
set _DBGBASE {0x80010000 0x80012000 0x80014000 0x80016000}
set _CTIBASE {0x80018000 0x80019000 0x8001a000 0x8001b000}

for { set _core 0 } { $_core < $_cores } { incr _core } {
	set _CTINAME $_CHIPNAME.cti$_core
	set _TARGETNAME $_CHIPNAME.cpu$_core

	cti create $_CTINAME -dap $_CHIPNAME.dap -ap-num 0 -baseaddr [lindex $_CTIBASE $_core]
	target create $_TARGETNAME aarch64 -dap $_CHIPNAME.dap -ap-num 0 -dbgbase [lindex $_DBGBASE $_core] -cti $_CTINAME
	$_TARGETNAME configure -event reset-assert-post { aarch64 dbginit }
}

# default target is cpu0
targets $_CHIPNAME.cpu0

# board/rpi3.cfg, rpi3-aarch32.cfg
transport select jtag
# Raspberry Pi boards only expose Test Reset (TRST) pin, no System Reset (SRST)
reset_config trst_only

# No GDB: OpenOCD alone halts, loads and resumes. This also frees the
# 3333..3336 ports the four cores would otherwise take.
gdb port disabled

# --- Step 1: watchdog reset (PM_WDOG, PM_RSTC), then OpenOCD exits ----------

proc uos_reset {} {
	targets bcm2837.cpu0
	halt
	mww 0x3f100024 0x5a000001
	mww 0x3f10001c 0x5a000020
	shutdown
}

# --- Step 2: run one test ----------------------------------------------------
#   elf    the test's *-hwd ELF
#   spin   address of __smp_spin in that ELF (nm), or "" if it has none
#   entry  default: 0x1003c (AArch32), 0x80000 (AArch64)

proc uos_run { elf spin {entry ""} } {
	global ARCH
	if { $ARCH == 32 } {
		set words 4
		if { $entry eq "" } { set entry 0x1003c }
	} else {
		set words 8
		if { $entry eq "" } { set entry 0x80000 }
	}

	echo "--- stage: halt cores 0 1 2 3 ---"
	foreach core {0 1 2 3} { targets bcm2837.cpu$core; halt }

	# Per core: a core whose semihosting is off stalls at a debug halt the
	# first time it traps, so every core needs it, not just core 0.
	echo "--- stage: enable semihosting on cores 0 1 2 3 ---"
	foreach core {0 1 2 3} { targets bcm2837.cpu$core; arm semihosting enable }

	echo "--- stage: load_image $elf ---"
	targets bcm2837.cpu0
	load_image $elf

	# Zeroed after the load, so a secondary that reaches its parking loop
	# before core 0 clears .bss cannot jump to a stale entry.
	if { $spin ne "" && $spin ne "0x" } {
		echo "--- stage: zero __smp_spin at $spin ($words words) ---"
		for { set i 0 } { $i < $words } { incr i } {
			mww [format 0x%x [expr { $spin + 4 * $i }]] 0
		}
	}

	echo "--- stage: resume cores 0 1 2 3 at $entry ---"
	if { $ARCH == 32 } {
		foreach core {0 1 2 3} {
			targets bcm2837.cpu$core
			reg cpsr 0x600001da
			resume $entry
		}
	} else {
		foreach core {0 1 2 3} {
			targets bcm2837.cpu$core
			reg pc $entry
			echo "  start PC core $core = [reg pc]"
		}
		foreach core {0 1 2 3} {
			targets bcm2837.cpu$core
			resume
		}
	}
}

# The AArch32 configs run init and halt themselves; the AArch64 ones are
# declarative and the runner adds "-c init" right after them. Here init is
# issued for both, at the end, which is the same point in the sequence.
init
if { $ARCH == 32 } {
	halt
}
