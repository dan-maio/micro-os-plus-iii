# =============================================================================
# OpenOCD script for Raspberry Pi Zero 2 W (BCM2837 AArch64) via J-Link
#
# Execution sequence:
#   1. Connect & initialize JTAG DAP
#   2. Trigger hardware watchdog reset:
#        mww 0x3f100024 0x5a000001   (PM_WDOG)
#        mww 0x3f10001c 0x5a000020   (PM_RSTC)
#   3. Wait 12 seconds for the board to reboot cleanly into EL2H
#   4. Halt all 4 cores and enable semihosting
#   5. Load ELF image into RAM
#   6. Set PC = $ENTRY (default 0x80000) on all cores and resume
#
# Usage:
#   openocd -f test_smpl/openocd-rpi-zero-2w.cfg -c "run_app /path/to/app.elf"
# or:
#   ELF=/path/to/app.elf openocd -f test_smpl/openocd-rpi-zero-2w.cfg
# =============================================================================

source [find interface/jlink.cfg]
source [find board/rpi3.cfg]

adapter speed 1000
gdb port disabled

proc run_app {elf_file {entry 0x80000}} {
    echo "========================================================"
    echo " Step 1: Trigger BCM2837 Watchdog Hardware Reset"
    echo "========================================================"
    poll_period 20000
    targets bcm2837.cpu0
    catch { halt }
    catch { mww 0x3f100024 0x5a000001 }
    catch { mww 0x3f10001c 0x5a000020 }

    echo "========================================================"
    echo " Step 2: Waiting 12s for board to boot into clean EL2H"
    echo "========================================================"
    sleep 12000
    poll_period 100

    echo "========================================================"
    echo " Step 3: Halting cores 0-3 and enabling semihosting"
    echo "========================================================"
    foreach core {0 1 2 3} {
        catch { bcm2837.cpu$core arp_examine }
        targets bcm2837.cpu$core
        catch { halt }
        arm semihosting enable
    }

    echo "========================================================"
    echo " Step 4: Loading ELF image: $elf_file"
    echo "========================================================"
    targets bcm2837.cpu0
    load_image $elf_file

    echo "========================================================"
    echo " Step 5: Setting PC to $entry and resuming all cores"
    echo "========================================================"
    foreach core {0 1 2 3} {
        targets bcm2837.cpu$core
        reg pc $entry
    }
    foreach core {0 1 2 3} {
        targets bcm2837.cpu$core
        resume
    }
}

init

# Auto-run if ELF is specified via environment variable or -c "set ELF ..."
if {[info exists ELF]} {
    if {![info exists ENTRY]} { set ENTRY 0x80000 }
    run_app $ELF $ENTRY
} elseif {[info exists ::env(ELF)]} {
    set entry_val 0x80000
    if {[info exists ::env(ENTRY)]} { set entry_val $::env(ENTRY) }
    run_app $::env(ELF) $entry_val
}
