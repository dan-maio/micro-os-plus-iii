# The Zero 2 W's (and Pi 3 B's) OpenOCD configuration for the probe in
# PROBE: jlink (the default), olimex or cmsis-dap -- the choice the board's
# hw.sh made from the same variable. The hardware tests (uos_tests_add_hwd)
# run OpenOCD with this file.
if {[info exists ::env(PROBE)]} {
  set _uos_probe $::env(PROBE)
} else {
  set _uos_probe jlink
}
switch -- $_uos_probe {
  jlink     { source [find openocd-jlink-rpi3.cfg] }
  olimex    { source [find openocd-olimex.cfg] }
  cmsis-dap { source [find openocd-cmsisdap-rpi3.cfg] }
  default   { error "PROBE must be jlink, olimex or cmsis-dap, not '$_uos_probe'" }
}
